name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1

      - name: Format check
        shell: pwsh
        run: ./scripts/check-format.ps1

      - name: Web lint check
        shell: pwsh
        run: ./scripts/lint-web.ps1

      - name: Build and test
        shell: pwsh
        run: ./scripts/build-test.ps1

      - name: Dependency vulnerability scan
        shell: pwsh
        run: ./scripts/dependency-audit.ps1

      - name: Secret scan
        shell: pwsh
        run: ./scripts/check-secrets.ps1

      - name: Media file block
        shell: pwsh
        run: ./scripts/check-media-files.ps1

      - name: Environment file block
        shell: pwsh
        run: ./scripts/check-env-secrets.ps1
